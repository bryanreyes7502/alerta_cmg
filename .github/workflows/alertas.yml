name: Alertas operación de centrales

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/Santiago"

concurrency:
  group: alertas-operacion-centrales
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar sistema de alertas
        env:
          EMAIL_APP_PASS: ${{ secrets.EMAIL_APP_PASS }}
        run: python main.py

      - name: Guardar estado de alertas
        run: |
          if git diff --quiet -- state/state.json; then
            echo "Sin cambios en el estado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git commit -m "chore: actualizar estado de alertas"
          git push
